[package]
name = "settings"
description = "schnellui example"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "settings"
path = "src/main.rs"

[dependencies]
# Umbrella crate: `App`, the `view!` macro, and the re-exported signal/scene/a11y APIs.
schnellui.workspace = true
clap.workspace = true
strum.workspace = true

[dev-dependencies]
# Tab-order reachability check (`testing::fuzz::tab_stops_reachable`).
schnellui = { workspace = true, features = ["fuzzing"] }
