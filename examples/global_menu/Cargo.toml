[package]
name = "global_menu"
description = "schnellui example: the system menu bar, one-shot screenshotter CLI (SOUL §7.1)"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "global_menu"
path = "src/main.rs"

[dependencies]
schnellui.workspace = true
clap.workspace = true
strum.workspace = true

[dev-dependencies]
# Live-resize equivalence checks (`testing::fuzz::HeadlessHost`).
schnellui = { workspace = true, features = ["fuzzing"] }
