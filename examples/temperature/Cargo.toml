[package]
name = "temperature"
description = "schnellui example"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "temperature"
path = "src/main.rs"

[dependencies]
schnellui.workspace = true
clap.workspace = true
strum.workspace = true

[dev-dependencies]
# Tab-order reachability check (`testing::fuzz::tab_stops_reachable`).
schnellui = { workspace = true, features = ["fuzzing"] }
