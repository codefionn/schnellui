[workspace]
resolver = "2"
members = [
    "crates/schnellui-template",
    "crates/schnellui-signal",
    "crates/schnellui-store",
    "crates/schnellui-view-parser",
    "crates/schnellui-macro",
    "crates/schnellui-layout",
    "crates/schnellui-localization",
    "crates/schnellui-platform",
    "crates/schnellui-text",
    "crates/schnellui-scene",
    "crates/schnellui-motion",
    "crates/schnellui-render-wgpu",
    "crates/schnellui-render-html",
    "crates/schnellui-a11y",
    "crates/schnellui-widgets",
    "crates/schnellui-theme",
    "crates/schnellui-icons",
    "crates/schnellui-icons-md",
    "crates/schnellui-charts",
    "crates/schnellui-testing",
    "crates/schnellui-servo",
    "crates/schnellui",
    "crates/schnellui-debug",
    "bench",
    "examples/counter",
    "examples/calculator",
    "examples/hello",
    "examples/temperature",
    "examples/settings",
    "examples/todo",
    "examples/layout_gallery",
    "examples/flexbox",
    "examples/charts",
    "examples/scroll_list",
    "examples/playground",
    "examples/rich_text",
    "examples/dialogs",
    "examples/dockable_workspace",
    "examples/grouped_tabs",
    "examples/md_icons",
    "examples/html_native",
    "examples/html_native_router",
    "examples/html_native_router_ssr",
    "examples/secure_todo_ssr",
    "examples/servo",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
repository = "https://github.com/codefionn/schnellui"

[workspace.dependencies]
# --- internal crates (path edges; see §8) ---
schnellui-signal = { path = "crates/schnellui-signal", version = "0.1.0" }
schnellui-store = { path = "crates/schnellui-store", version = "0.1.0" }
schnellui-template = { path = "crates/schnellui-template", version = "0.1.0" }
schnellui-view-parser = { path = "crates/schnellui-view-parser", version = "0.1.0" }
schnellui-macro = { path = "crates/schnellui-macro", version = "0.1.0" }
schnellui-layout = { path = "crates/schnellui-layout", version = "0.1.0" }
schnellui-localization = { path = "crates/schnellui-localization", version = "0.1.0" }
schnellui-platform = { path = "crates/schnellui-platform", version = "0.1.0" }
schnellui-text = { path = "crates/schnellui-text", version = "0.1.0" }
schnellui-scene = { path = "crates/schnellui-scene", version = "0.1.0" }
schnellui-motion = { path = "crates/schnellui-motion", version = "0.1.0" }
schnellui-render-wgpu = { path = "crates/schnellui-render-wgpu", version = "0.1.0" }
schnellui-render-html = { path = "crates/schnellui-render-html", version = "0.1.0" }
schnellui-a11y = { path = "crates/schnellui-a11y", version = "0.1.0" }
schnellui-widgets = { path = "crates/schnellui-widgets", version = "0.1.0" }
schnellui-theme = { path = "crates/schnellui-theme", version = "0.1.0" }
schnellui-icons = { path = "crates/schnellui-icons", version = "0.1.0" }
schnellui-icons-md = { path = "crates/schnellui-icons-md", version = "0.1.0" }
schnellui-charts = { path = "crates/schnellui-charts", version = "0.1.0" }
schnellui-testing = { path = "crates/schnellui-testing", version = "0.1.0" }
schnellui-servo = { path = "crates/schnellui-servo", version = "0.1.0" }
schnellui = { path = "crates/schnellui", version = "0.1.0" }

# --- shared low-level deps (§4.4) ---
slotmap = "1"
smallvec = "1"
parking_lot = "0.12"
once_cell = "1"
bytemuck = { version = "1", features = ["derive"] }
unicode-segmentation = "1"

# --- macro / parser (§3.3) ---
proc-macro2 = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
rstml = "0.12"

# --- layout / text / gpu / a11y ---
taffy = "0.12"
parley = "0.11"
swash = "0.2"
fontique = "0.11"
wgpu = "30"
pollster = "0.4"
png = "0.18"
accesskit = "0.24"
# Cross-platform native adapter: AT-SPI on Linux, UI Automation on Windows,
# and NSAccessibility on macOS (the crate selects its platform backend by target).
accesskit_winit = "0.33.2"
# opt-in windowed (non-headless) mode: winit 0.30 ApplicationHandler event loop
# glue in the umbrella crate (SOUL §8). Headless one-shot screenshotting (§7) never
# touches this — it is only reached through `App::run_windowed`.
winit = "0.30"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

# --- native accessibility preferences ---
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }
async-io = "2"
futures-util = "0.3"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSLocale", "NSString"] }
windows-sys = { version = "0.61", features = [
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemServices",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# --- serialization / cli / testing ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jaq-core = "3.1"
jaq-json = { version = "2.0", features = ["serde"] }
jaq-std = "3.0"
shell-words = "1.1"
image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
allocation-counter = "0.8"
md-icons = "0.4.0"
chromiumoxide = "0.9.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
lto = "thin"
