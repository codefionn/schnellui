name: Check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          # Transient mirror/DNS failures on hosted runners have failed this
          # step before; retry before giving up.
          for attempt in 1 2 3 4; do
            if sudo apt-get update && sudo apt-get install -y \
                pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev; then
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "apt-get failed after $attempt attempts" >&2
              exit 1
            fi
            echo "apt-get failed (attempt $attempt); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      # Servo is excluded like in scripts/ci.sh: building it takes longer than the
      # rest of the workspace together. Warnings fail the job.
      - name: Clippy
        run: |
          cargo clippy --locked --workspace --all-targets \
              --exclude schnellui-servo --exclude servo_demo -- -D warnings

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      # Catches manifest and packaging problems before a release tag does.
      - name: Package publishable crates
        run: cargo publish --workspace --dry-run --no-verify --locked
