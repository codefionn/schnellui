[package]
name = "schnellui-render-html"
description = "Native DOM/CSS renderer and Chromiumoxide screenshot backend for schnellui"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
ssr = []

[dependencies]
schnellui-template.workspace = true
schnellui-widgets.workspace = true
schnellui-scene.workspace = true
schnellui-motion.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chromiumoxide.workspace = true
futures.workspace = true
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
