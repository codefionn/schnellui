[package]
name = "schnellui-servo"
description = "Servo browser embedding and persistent shared-session primitives for SchnellUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
servo-engine = ["dep:cookie", "dep:dpi", "dep:primeorder", "dep:servo"]

[dependencies]
cookie = { version = "0.18", optional = true }
dpi = { version = "0.1", optional = true }
# Servo 0.4's RustCrypto pre-release curve crates require the matching
# primeorder pre-release. A broad transitive requirement otherwise resolves to
# incompatible primeorder 0.14.0 after its stable publication.
primeorder = { version = "=0.14.0-rc.14", optional = true }
schnellui.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
url = { version = "2.5", features = ["serde"] }
servo = { version = "=0.4.0", optional = true }

[dev-dependencies]
rustls = "0.23"
tempfile = "3"
