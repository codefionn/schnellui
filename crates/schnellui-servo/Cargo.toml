[package]
name = "schnellui-servo"
description = "Servo browser embedding and persistent shared-session primitives for SchnellUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
servo-engine = ["dep:cookie", "dep:dpi", "dep:servo"]

[dependencies]
cookie = { version = "0.18.2", optional = true }
dpi = { version = "0.1.2", optional = true }
schnellui.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2.0.21"
url = { version = "2.5.8", features = ["serde"] }
servo = { version = "0.7", optional = true }

[dev-dependencies]
rustls = "0.23.45"
tempfile = "3.27.0"
