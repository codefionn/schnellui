[package]
name = "schnellui-servo"
description = "Servo browser embedding and persistent shared-session primitives for SchnellUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
servo-engine = ["dep:cookie", "dep:dpi", "dep:servo"]

[dependencies]
cookie = { version = "0.18", optional = true }
dpi = { version = "0.1.1", optional = true }
schnellui.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = ">=1.0.40, <3"
url = { version = "2.5", features = ["serde"] }
servo = { version = "0.8", optional = true }

[dev-dependencies]
rustls = "0.23.27"
tempfile = "3.10"
