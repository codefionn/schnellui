plugins {
    id 'com.android.application'
}

android {
    namespace = 'io.github.codefionn.schnellui.demo'
    compileSdk = 37
    buildToolsVersion = '37.0.0'

    defaultConfig {
        applicationId = 'io.github.codefionn.schnellui.demo'
        minSdk = 26
        targetSdk = 37
        versionCode = 1
        versionName = '0.1'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // The .so files come from build-rust.sh and are not committed.
    sourceSets {
        main {
            jniLibs.directories.add('src/main/jniLibs')
        }
    }
}

dependencies {
    implementation project(':host')
}
